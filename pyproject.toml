[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsim"
version = "0.1.0"
description = "Crypto market-making simulator: live paper trading and replay backtests on real order-book data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mmsim = "mmsim.cli:main"

[tool.setuptools.packages.find]
include = ["mmsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
